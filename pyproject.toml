[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "solar-forge-game-engine"
version = "0.1.0"
description = "Native Python 2D game editor for Solar Forge Studios"
requires-python = ">=3.14,<3.15"
dependencies = ["PySide6-Essentials==6.11.2"]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-qt==4.5.0",
  "ruff==0.16.9",
  "mypy==2.4.0",
]

[project.scripts]
solar-forge-engine = "solar_forge_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_forge_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
